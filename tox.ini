[tox]
envlist = py3.12-django{4, 5}-djangorestframework{3.15}

[base]
deps =
    ipdb
    coverage
    setuptools
    twine

commands =
    {envbindir}/django-admin version
    {envbindir}/coverage run \
        --branch \
        --omit={envdir}/*,test_app/*.py,*/migrations/*.py \
        {envbindir}/django-admin test

[testenv]
allowlist_externals =
    /bin/rm
    /usr/bin/make
    /usr/bin/git
    /usr/bin/tx
    /usr/bin/sphinx-intl
    twine

setenv =
    DJANGO_SETTINGS_MODULE=tests.settings
    PYTHONPATH=.

deps =
    django4: Django>=4.2,<5.0
    django5: Django>=5.0,<6.0
    djangorestframework3.15: djangorestframework>=3.15.2,<3.16
    {[base]deps}

commands =
    {[base]commands}
    coverage report


[testenv:docs]
changedir = docs

deps =
    sphinx
    sphinx-rtd-theme
    sphinx_fontawesome
    sphinx-intl
    transifex-client
    rst2pdf
    django-sphinx
    django
    djangorestframework

commands =
    /usr/bin/make clean
    # /usr/bin/make -e SPHINXOPTS="-D language='en'" html
    /usr/bin/make -e SPHINXOPTS="-D language='ja'" html

[testenv:sync-transifex]
changedir = docs

deps = {[testenv:docs]deps}

commands =
    /usr/bin/make gettext
    sphinx-intl update-txconfig-resources --pot-dir _build/locale --transifex-project-name restframework-definable-serializer-documentation
    tx pull -l en
    tx push -s
    sphinx-intl update -p _build/locale -l ja_JP -l en


[testenv:bdist_wheel]

commands =
    python setup.py clean --all
    /bin/rm -rf ./restframework_definable_serializer.egg-info
    python setup.py bdist_wheel
    # twine upload -r testpypi dist/*.* --skip-existing


[testenv:upload_testpypi]
commands =
    {[testenv:bdist_wheel]commands}
    twine upload -r testpypi dist/*.* --skip-existing


[testenv:upload_production_pypi]
commands =
    {[testenv:bdist_wheel]commands}
    twine upload -r pypi dist/*.* --skip-existing
